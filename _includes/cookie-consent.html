<style>
  #cookie-notice {
    padding: 0.5rem 1rem;
    display: none;
    text-align: center;
    position: fixed;
    bottom: 0;
    width: calc(100% - 2rem);
    background: #222;
    color: rgba(255, 255, 255, 0.8);
  }
  #cookie-notice p {
    margin-bottom: 0;
  }
  #cookie-notice .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
  }
  #cookie-notice a {
    cursor: pointer;
  }
  #cookie-notice a:hover {
    color: white;
  }
  @media (max-width: 767px) {
    #cookie-notice p {
      padding-top: 3px;
      margin-bottom: 1rem;
    }
    #cookie-notice a {
      position: relative;
      bottom: 4px;
    }
  }
</style>
<div id="cookie-notice">
  <p>We would like to use third party cookies and scripts to improve the functionality of this website.</p>
  <div class="actions">
    <a id="cookie-notice-accept" class="btn btn-primary btn-sm">Approve</a>
    <span>|</span>
    <a id="cookie-notice-deny" class="btn btn-primary btn-sm">Deny</a>
  </div>
</div>
<script>
  function createCookie(name, value, days) {
    var expires = "";
    if (days) {
      var date = new Date();
      date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
      expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + value + expires + "; path=/";
  }
  function readCookie(name) {
    var nameEQ = name + "=";
    var ca = document.cookie.split(";");
    for (var i = 0; i < ca.length; i++) {
      var c = ca[i];
      while (c.charAt(0) == " ") c = c.substring(1, c.length);
      if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
    }
    return null;
  }
  function eraseCookie(name) {
    createCookie(name, "", -1);
  }

  function acceptThirdPartyCookies() {
    createCookie("cookie-notice-accept", "true", 365);
  }

  function denyThirdPartyCookies() {
    createCookie("cookie-notice-deny", "true", 30);
  }

  function dismissNotice(days) {
    createCookie("cookie-notice-dismissed", "true", days);
    document.getElementById("cookie-notice").style.display = "none";
    location.reload();
  }

  if (readCookie("cookie-notice-dismissed") != "true") {
    document.getElementById("cookie-notice").style.display = "block";
  }
  document.getElementById("cookie-notice-deny").addEventListener("click", function () {
    denyThirdPartyCookies();
    dismissNotice(30);
  });
  document.getElementById("cookie-notice-accept").addEventListener("click", function () {
    acceptThirdPartyCookies();
    dismissNotice(365);
  });
</script>
